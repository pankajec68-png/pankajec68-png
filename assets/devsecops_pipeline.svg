<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="activeNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(56, 189, 248, 0.08)"/>
    </pattern>
  </defs>

  <style>
    @keyframes pipeDash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulseSuccess {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 2px #10b981); }
      50% { fill: #34d399; filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes movingLaser {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(780px); opacity: 0; }
    }
    .pipeline-wire {
      stroke-dasharray: 8 6;
      stroke-dashoffset: 0;
      animation: pipeDash 2s linear infinite;
    }
    .check-pulsing {
      animation: pulseSuccess 2s ease-in-out infinite;
    }
    .laser-bullet {
      animation: movingLaser 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .txt-b {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
    }
    .txt-r {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
    }
  </style>

  <!-- Background -->
  <rect width="950" height="200" rx="16" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="950" height="200" rx="16" fill="url(#dotGrid)"/>

  <!-- Title Banner -->
  <g transform="translate(30, 22)">
    <circle cx="8" cy="8" r="4" fill="#38bdf8" class="check-pulsing"/>
    <text x="20" y="12" fill="#7dd3fc" font-size="11.5" class="txt-b" letter-spacing="0.8">
      AUTOMATED DEVSECOPS &amp; TERRAFORM CI/CD PIPELINE WITH DRIFT DETECTION
    </text>
  </g>

  <!-- Continuous Pipeline Connecting Wire -->
  <path d="M 85 105 L 865 105" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M 85 105 L 865 105" stroke="#38bdf8" stroke-width="2.5" class="pipeline-wire" stroke-linecap="round"/>

  <!-- Animated Laser Signal Traveling Through Pipeline -->
  <g transform="translate(85, 105)">
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#packetGlow)" class="laser-bullet"/>
  </g>

  <!-- ==================== STAGE 1: PR CREATION ==================== -->
  <g transform="translate(50, 65)">
    <rect width="130" height="80" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="130" height="24" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#38bdf8" font-size="10.5" class="txt-b">1. PULL REQUEST</text>
    <text x="12" y="44" fill="#f8fafc" font-size="10" class="txt-b">Trunk-Based</text>
    <text x="12" y="58" fill="#94a3b8" font-size="9" class="txt-r">Short-lived branches</text>
    <circle cx="114" cy="46" r="6" fill="#10b981" class="check-pulsing"/>
  </g>

  <!-- ==================== STAGE 2: SECURITY & LINT ==================== -->
  <g transform="translate(225, 65)">
    <rect width="135" height="80" rx="10" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.2"/>
    <rect width="135" height="24" rx="10" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#c084fc" font-size="10.5" class="txt-b">2. SCAN &amp; LINT</text>
    <text x="12" y="44" fill="#f8fafc" font-size="10" class="txt-b">TFLint &amp; Secrets</text>
    <text x="12" y="58" fill="#94a3b8" font-size="9" class="txt-r">TruffleHog / Checkov</text>
    <circle cx="119" cy="46" r="6" fill="#10b981" class="check-pulsing"/>
  </g>

  <!-- ==================== STAGE 3: INFRACOST BUDGET ==================== -->
  <g transform="translate(405, 65)">
    <rect width="135" height="80" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.2"/>
    <rect width="135" height="24" rx="10" fill="#047857" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#4ade80" font-size="10.5" class="txt-b">3. FINOPS SHIFT-LEFT</text>
    <text x="12" y="44" fill="#f8fafc" font-size="10" class="txt-b">Infracost Budget</text>
    <text x="12" y="58" fill="#94a3b8" font-size="9" class="txt-r">Delta cost on PR</text>
    <circle cx="119" cy="46" r="6" fill="#10b981" class="check-pulsing"/>
  </g>

  <!-- ==================== STAGE 4: APPROVAL GATE ==================== -->
  <g transform="translate(585, 65)">
    <rect width="135" height="80" rx="10" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="135" height="24" rx="10" fill="#b45309" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fbbf24" font-size="10.5" class="txt-b">4. CODE OWNERS</text>
    <text x="12" y="44" fill="#f8fafc" font-size="10" class="txt-b">Manual Gate</text>
    <text x="12" y="58" fill="#94a3b8" font-size="9" class="txt-r">Architect Sign-off</text>
    <circle cx="119" cy="46" r="6" fill="#10b981" class="check-pulsing"/>
  </g>

  <!-- ==================== STAGE 5: TERRAFORM APPLY & DRIFT ==================== -->
  <g transform="translate(765, 65)">
    <rect width="140" height="80" rx="10" fill="url(#activeNode)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="140" height="24" rx="10" fill="#0284c7"/>
    <text x="12" y="16" fill="#ffffff" font-size="10.5" class="txt-b">5. PROD APPLY</text>
    <text x="12" y="44" fill="#f8fafc" font-size="10" class="txt-b">Drift Detection</text>
    <text x="12" y="58" fill="#bae6fd" font-size="9" class="txt-r">Nightly plan pipeline</text>
    <circle cx="124" cy="46" r="6" fill="#34d399" class="check-pulsing"/>
  </g>

  <!-- Bottom Mini Legend -->
  <g transform="translate(50, 168)">
    <text x="0" y="10" fill="#64748b" font-size="10" class="txt-r">
      🛡️ ZERO SECRETS COMMITTED  •  ⚡ AUTOMATED ROLLBACK TEMPLATES  •  🔒 REMOTE STATE BLOB LEASE LOCKING
    </text>
  </g>
</svg>
