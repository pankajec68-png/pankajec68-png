<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="snakeCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Filters for Snake Head -->
    <filter id="snakeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes moveSnakeHead {
      0%   { transform: translate(60px, 45px); }
      15%  { transform: translate(240px, 45px); }
      25%  { transform: translate(240px, 75px); }
      40%  { transform: translate(450px, 75px); }
      55%  { transform: translate(450px, 105px); }
      75%  { transform: translate(680px, 105px); }
      85%  { transform: translate(680px, 45px); }
      100% { transform: translate(780px, 45px); }
    }
    @keyframes eatDot {
      0%, 100% { fill: #164e63; opacity: 0.6; }
      50% { fill: #22d3ee; opacity: 1; filter: drop-shadow(0 0 6px #22d3ee); }
    }
    @keyframes pulseEye {
      0%, 100% { fill: #ffffff; }
      50% { fill: #facc15; }
    }
    .snake-head {
      animation: moveSnakeHead 8s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .food-dot {
      animation: eatDot 3s ease-in-out infinite;
    }
    .snake-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
    }
  </style>

  <!-- Card Background -->
  <rect width="850" height="170" rx="14" fill="url(#snakeCardBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Text -->
  <g transform="translate(30, 22)">
    <circle cx="6" cy="6" r="3.5" fill="#38bdf8"/>
    <text x="18" y="10" fill="#94a3b8" font-size="11" class="snake-text" letter-spacing="0.5">
      AUTOMATED GITHUB CONTRIBUTIONS ENGINE • SNAKE SIMULATION
