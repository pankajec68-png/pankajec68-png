<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes streamDash {
      to { stroke-dashoffset: -100; }
    }
    .pulsing-cloud {
      transform-origin: 820px 130px;
      animation: floatCloud 4s ease-in-out infinite;
    }
    .orbit-spinner {
      transform-origin: 820px 130px;
      animation: radarSpin 14s linear infinite;
    }
    .blinking-dot {
      animation: blink 1.5s infinite;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: streamDash 3s linear infinite;
    }
    .font-heavy {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
    }
    .font-medium {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
    }
    .font-regular {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Card Background -->
  <rect width="950" height="280" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="950" height="280" rx="20" fill="url(#cyanOrb)"/>
  <rect width="950" height="280" rx="20" fill="url(#purpleOrb)"/>
  <rect width="950" height="280" rx="20" fill="url(#grid)"/>

  <!-- Left Content -->
  <!-- Status Badge -->
  <g transform="translate(40, 30)">
    <rect width="365" height="28" rx="14" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="blinking-dot"/>
    <text x="28" y="18" fill="#34d399" font-size="11" class="font-heavy" letter-spacing="0.8">ACTIVELY INTERVIEWING • ENTERPRISE CLOUD ARCHITECT</text>
  </g>

  <!-- Name -->
  <text x="40" y="105" fill="url(#textGrad)" font-size="40" class="font-heavy" letter-spacing="-0.5">Pankaj Singh</text>

  <!-- Role Subtitle -->
  <text x="40" y="136" fill="#93c5fd" font-size="16" class="font-medium" letter-spacing="0.2">
    ☁️ Enterprise Cloud Architect  |  🛡️ Principal DevSecOps &amp; Migration Lead
  </text>

  <!-- Description -->
  <text x="40" y="165" fill="#94a3b8" font-size="12.5" class="font-regular">
    Translating High-Level Business Drivers into Resilient, Zero-Trust &amp; FinOps-Governed Architectures.
  </text>
  <text x="40" y="183" fill="#94a3b8" font-size="12.5" class="font-regular">
    Specializing in 100+ Workload Migrations, Azure CAF Landing Zones &amp; Modular IaC Pipelines.
  </text>

  <!-- Badges Cluster -->
  <g transform="translate(40, 206)">
    <!-- Pill 1: 100+ Workloads -->
    <g transform="translate(0, 0)">
      <rect width="180" height="26" rx="6" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
      <text x="10" y="17" fill="#38bdf8" font-size="11.5" class="font-medium">🚀 100+ Workloads Migrated</text>
    </g>
    <!-- Pill 2: Terraform Landing Zones -->
    <g transform="translate(190, 0)">
      <rect width="185" height="26" rx="6" fill="#3b0764" fill-opacity="0.4" stroke="#7e22ce" stroke-width="1"/>
      <text x="10" y="17" fill="#c084fc" font-size="11.5" class="font-medium">⚡ Terraform Landing Zones</text>
    </g>
    <!-- Pill 3: FinOps -->
    <g transform="translate(385, 0)">
      <rect width="160" height="26" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
      <text x="10" y="17" fill="#4ade80" font-size="11.5" class="font-medium">💰 40% FinOps Savings</text>
    </g>
    <!-- Pill 4: Zero Trust -->
    <g transform="translate(555, 0)">
      <rect width="165" height="26" rx="6" fill="#1e1b4b" fill-opacity="0.5" stroke="#4338ca" stroke-width="1"/>
      <text x="10" y="17" fill="#818cf8" font-size="11.5" class="font-medium">🛡️ Zero-Trust Security / PIM</text>
    </g>
  </g>

  <!-- Bottom Mini Footer in Card -->
  <g transform="translate(40, 252)">
    <text x="0" y="12" fill="#64748b" font-size="11" class="font-medium">
      EXPERTISE: AZURE CAF • TERRAFORM • DEVSECOPS • HUB &amp; SPOKE • BCDR • FINOPS • TAM LEADERSHIP
    </text>
  </g>

  <!-- Right Visual Animation (Pure Native SVG Elements) -->
  <g class="orbit-spinner">
    <circle cx="820" cy="130" r="80" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="820" cy="50" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="820" cy="210" r="3.5" fill="#818cf8"/>
  </g>

  <!-- Outer Ambient Ring -->
  <circle cx="820" cy="130" r="62" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  
  <!-- Glowing Center Glow -->
  <circle cx="820" cy="130" r="54" fill="#0f172a" stroke="url(#textGrad)" stroke-width="2" filter="url(#pulseGlow)"/>

  <!-- Pulsing Cloud and Upload Arrow -->
  <g class="pulsing-cloud">
    <!-- Cloud Path -->
    <path d="M 836 126 C 840 126 844 122.5 844 118 C 844 113.8 840.8 110.4 836.7 110 C 835.8 102.7 829.7 97 822.2 97 C 816 97 810.6 101.1 808.7 106.8 C 807.8 106.4 806.7 106.2 805.7 106.2 C 800.9 106.2 797 110.1 797 114.9 C 797 119.1 800 122.7 804.1 123.4" 
          fill="none" stroke="url(#cloudGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Upload Arrow -->
    <path d="M 814 136 L 821 128 L 828 136" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 821 128 L 821 146" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Status pill under cloud -->
  <g transform="translate(745, 218)">
    <rect width="150" height="24" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <circle cx="16" cy="12" r="3.5" fill="#38bdf8" class="blinking-dot"/>
    <text x="26" y="16" fill="#e2e8f0" font-size="10.5" class="font-heavy" letter-spacing="0.5">99.99% RESILIENT SLA</text>
  </g>
</svg>
