name: "Generate Contribution Snake Animation"

on:
  schedule:
    # Run every 24 hours at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: "Generate Snake SVG"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Generate Contribution Snake SVG"
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0f172a,#164e63,#0891b2,#06b6d4,#38bdf8
        continue-on-error: true

      - name: "Commit & Push Updated Snake Animation"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg || true
          if git diff --staged --quiet; then
            echo "No changes in contribution grid."
          else
            git commit -m "chore(automation): update contribution grid snake animation [skip ci]"
            git push
          fi
